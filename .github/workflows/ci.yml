name: CI/CD Pipeline for Credit Risk Model

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest
      
      - name: Lint with flake8
        run: |
          # Only lint files that exist (src/*.py, not src/api/)
          flake8 src/*.py --count --select=E9,F63,F7,F82 --show-source --statistics || true
          flake8 tests/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
      
      - name: Test with pytest
        run: |
          pytest tests/ -v